{% extends "base.html" %}
{% block content %}

<div style="
    max-width:520px;
    margin:40px auto;
    background:white;
    padding:24px;
    border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,0.06);
">

    <h2 style="text-align:center; color:var(--green); margin-bottom:20px;">
        Edit Question
    </h2>

    <form method="POST">

        <div style="margin-bottom:15px;">
            <label style="font-weight:600;">Question:</label>
            <input type="text" name="question_text" value="{{ question.question_text }}" required
                   style="width:100%; padding:10px; margin-top:6px; border-radius:6px; border:1px solid #ccc;">
        </div>

        <div style="margin-bottom:15px;">
            <label style="font-weight:600;">Options:</label>
            <input type="text" name="option1" value="{{ question.option1 }}" required style="width:100%; padding:10px; margin:6px 0; border-radius:6px; border:1px solid #ccc;">
            <input type="text" name="option2" value="{{ question.option2 }}" required style="width:100%; padding:10px; margin:6px 0; border-radius:6px; border:1px solid #ccc;">
            <input type="text" name="option3" value="{{ question.option3 }}" required style="width:100%; padding:10px; margin:6px 0; border-radius:6px; border:1px solid #ccc;">
            <input type="text" name="option4" value="{{ question.option4 }}" required style="width:100%; padding:10px; margin:6px 0; border-radius:6px; border:1px solid #ccc;">
        </div>

        <div style="margin-bottom:15px;">
            <label style="font-weight:600;">Correct Option:</label>
            <select name="correct_option" required style="width:100%; padding:10px; margin-top:6px; border-radius:6px; border:1px solid #ccc;">
                <option value="">--Select Correct Option--</option>
                <option value="A" {% if question.correct_option == "A" %}selected{% endif %}>Option A</option>
                <option value="B" {% if question.correct_option == "B" %}selected{% endif %}>Option B</option>
                <option value="C" {% if question.correct_option == "C" %}selected{% endif %}>Option C</option>
                <option value="D" {% if question.correct_option == "D" %}selected{% endif %}>Option D</option>
            </select>
        </div>

        <button class="btn" type="submit" style="width:100%; font-size:16px;">
            Update Question
        </button>
    </form>

</div>

{% endblock %}
