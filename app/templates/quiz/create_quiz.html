{% extends "base.html" %}
{% block content %}

<div style="
    max-width:750px;
    margin:40px auto;
    background:white;
    padding:32px;
    border-radius:12px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
">

    <h2 style="text-align:center; color:#2e7d32; margin-bottom:25px;">
        Create New Quiz for "{{ course.title }}"
    </h2>

    <form method="POST" action="{{ url_for('quiz_bp.create_quiz', course_id=course.id) }}">

        <!-- Quiz Title -->
        <div style="margin-bottom:25px;">
            <label style="font-weight:600; font-size:15px;">Quiz Title</label>
            <input type="text" name="title" required
                   placeholder="Enter quiz title"
                   style="
                       width:100%; padding:12px; margin-top:6px;
                       border-radius:8px; border:1px solid #ccc; font-size:15px;">
        </div>

        <hr style="margin:20px 0;">

        <h3 style="color:#1976d2; margin-bottom:20px;">Questions</h3>

        <!-- Questions Container -->
        <div id="questions-container">

            <!-- Question Block Template -->
            <div class="question-block" style="
                background:#f9fff9;
                padding:20px;
                border-radius:10px;
                border:1px solid #d8e8d8;
                margin-bottom:25px;
            ">

                <label style="font-weight:600;">Question 1:</label>
                <textarea name="question_text[]" rows="2" required
                          placeholder="Enter question"
                          style="width:100%; padding:12px; margin-top:6px;
                                 border-radius:8px; border:1px solid #ccc; resize:none;"></textarea>

                <div style="margin-top:15px;">
                    <label style="font-weight:600;">Options:</label>

                    <input type="text" name="options[0][]" placeholder="Option A" required
                           style="width:100%; padding:10px; margin-top:6px;
                                  border-radius:8px; border:1px solid #ccc;">

                    <input type="text" name="options[0][]" placeholder="Option B" required
                           style="width:100%; padding:10px; margin-top:6px;
                                  border-radius:8px; border:1px solid #ccc;">

                    <input type="text" name="options[0][]" placeholder="Option C" required
                           style="width:100%; padding:10px; margin-top:6px;
                                  border-radius:8px; border:1px solid #ccc;">

                    <input type="text" name="options[0][]" placeholder="Option D" required
                           style="width:100%; padding:10px; margin-top:6px;
                                  border-radius:8px; border:1px solid #ccc;">
                </div>

                <div style="margin-top:15px;">
                    <label style="font-weight:600;">Correct Option:</label>
                    <select name="correct_option[]" required
                            style="width:100%; padding:10px; margin-top:6px;
                                   border-radius:8px; border:1px solid #ccc;">
                        <option value="">Select Correct Option</option>
                        <option value="1">Option A</option>
                        <option value="2">Option B</option>
                        <option value="3">Option C</option>
                        <option value="4">Option D</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Add Question Button -->
        <button type="button"
                onclick="addQuestion()"
                style="
                    width:100%; background:#1976d2; color:white;
                    padding:12px; border:none; border-radius:8px;
                    font-size:16px; font-weight:600; cursor:pointer;">
            + Add Another Question
        </button>

        <!-- Submit -->
        <button type="submit"
                style="
                    width:100%; margin-top:15px; background:#2e7d32; color:white;
                    padding:12px; border:none; border-radius:8px;
                    font-size:16px; font-weight:600;">
            Save Quiz
        </button>

    </form>
</div>

<script>
let questionCount = 1;

function addQuestion() {
    const container = document.getElementById('questions-container');

    const html = `
    <div class="question-block" style="
        background:#f9fff9;
        padding:20px;
        border-radius:10px;
        border:1px solid #d8e8d8;
        margin-bottom:25px;
    ">

        <label style="font-weight:600;">Question ${questionCount + 1}:</label>
        <textarea name="question_text[]" rows="2" required
                  style="width:100%; padding:12px; margin-top:6px;
                         border-radius:8px; border:1px solid #ccc; resize:none;"></textarea>

        <div style="margin-top:15px;">
            <label style="font-weight:600;">Options:</label>

            <input type="text" name="options[${questionCount}][]" placeholder="Option A" required
                   style="width:100%; padding:10px; margin-top:6px;
                          border-radius:8px; border:1px solid #ccc;">

            <input type="text" name="options[${questionCount}][]" placeholder="Option B" required
                   style="width:100%; padding:10px; margin-top:6px;
                          border-radius:8px; border:1px solid #ccc;">

            <input type="text" name="options[${questionCount}][]" placeholder="Option C" required
                   style="width:100%; padding:10px; margin-top:6px;
                          border-radius:8px; border:1px solid #ccc;">

            <input type="text" name="options[${questionCount}][]" placeholder="Option D" required
                   style="width:100%; padding:10px; margin-top:6px;
                          border-radius:8px; border:1px solid #ccc;">
        </div>

        <div style="margin-top:15px;">
            <label style="font-weight:600;">Correct Option:</label>
            <select name="correct_option[]" required
                    style="width:100%; padding:10px; margin-top:6px;
                           border-radius:8px; border:1px solid #ccc;">
                <option value="">Select Correct Option</option>
                <option value="1">Option A</option>
                <option value="2">Option B</option>
                <option value="3">Option C</option>
                <option value="4">Option D</option>
            </select>
        </div>

    </div>`;

    container.insertAdjacentHTML("beforeend", html);
    questionCount++;
}
</script>

{% endblock %}
