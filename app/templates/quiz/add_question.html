{% extends "base.html" %}
{% block content %}

<h2 class="text-success mb-4">Add Multiple Questions</h2>

<style>
    .question-block {
        border: 1px solid #ddd;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        background: #ffffff;
    }

    label {
        font-weight: 600;
        margin-top: 8px;
    }

    input[type="text"], input[type="number"] {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    .btn-custom {
        background: #2e7d32;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
    }

    .btn-custom:hover {
        background: #256428;
    }
</style>

<form method="POST">
    <div id="questions-container">

        <div class="question-block">
            <label>Question:</label>
            <input type="text" name="question[]" required>

            <label>Option 1:</label>
            <input type="text" name="option1[]" required>

            <label>Option 2:</label>
            <input type="text" name="option2[]" required>

            <label>Option 3:</label>
            <input type="text" name="option3[]" required>

            <label>Option 4:</label>
            <input type="text" name="option4[]" required>

            <label>Correct Option (1–4):</label>
            <input type="number" name="correct_option[]" min="1" max="4" required>
        </div>

    </div>

    <button type="button" class="btn-custom" onclick="addQuestionBlock()">+ Add Another Question</button>
    <button type="submit" class="btn-custom">Save All Questions</button>

</form>

<script>
function addQuestionBlock() {
    let container = document.getElementById('questions-container');

    let block = document.createElement('div');
    block.className = 'question-block';

    block.innerHTML = `
        <label>Question:</label>
        <input type="text" name="question[]" required>

        <label>Option 1:</label>
        <input type="text" name="option1[]" required>

        <label>Option 2:</label>
        <input type="text" name="option2[]" required>

        <label>Option 3:</label>
        <input type="text" name="option3[]" required>

        <label>Option 4:</label>
        <input type="text" name="option4[]" required>

        <label>Correct Option (1–4):</label>
        <input type="number" name="correct_option[]" min="1" max="4" required>
    `;

    container.appendChild(block);
}
</script>

{% endblock %}
