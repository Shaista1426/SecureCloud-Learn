{% extends "base.html" %}

{% block content %}
<h2>Add Questions to Quiz: "{{ quiz.title }}"</h2>

<form method="POST" style="max-width:700px;">
    <label>Question:</label>
    <textarea name="question_text" required style="width:100%; padding:8px; margin-bottom:10px;"></textarea>

    <label>Option 1:</label>
    <input type="text" name="option1" required style="width:100%; padding:8px; margin-bottom:10px;">

    <label>Option 2:</label>
    <input type="text" name="option2" required style="width:100%; padding:8px; margin-bottom:10px;">

    <label>Option 3:</label>
    <input type="text" name="option3" required style="width:100%; padding:8px; margin-bottom:10px;">

    <label>Option 4:</label>
    <input type="text" name="option4" required style="width:100%; padding:8px; margin-bottom:10px;">

    <label>Correct Option:</label>
    <select name="correct_option" required style="width:100%; padding:8px; margin-bottom:10px;">
        <option value="">--Select--</option>
        <option value="option1">Option 1</option>
        <option value="option2">Option 2</option>
        <option value="option3">Option 3</option>
        <option value="option4">Option 4</option>
    </select>

    <button type="submit" class="btn">Add Question</button>
</form>

{% if questions %}
<h3>Questions Added:</h3>
<ul>
    {% for q in questions %}
    <li>{{ q.question_text }} - (Correct: {{ q.correct_option }})</li>
    {% endfor %}
</ul>
{% endif %}
{% endblock %}
